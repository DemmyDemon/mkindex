<!DOCTYPE html>
<html>
    <head>
        <title>Images</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background: #030303;
            }
            article {
                width: 100vw;
                height: 100vh;
            }
            footer {
                width: 100vw;
                font-size: 2vh;
                height: 2em;
                bottom: 0;
                color: #FFFFFF33;
                margin: 0 auto;
                margin-top: -2.5em;
                display: block;
                text-align: center;
                text-shadow: 0px 1px 5px #00000033;
                pointer-events: none;
                overflow: hidden;
            }
            img {
                margin: 0; /* auto; */
                display: block;
                height: 100vh;
                width: 100vw;
                object-fit: contain;
                pointer-events: none;
            }
            #name {
                font-size: 0.75em;
            }
        </style>
    </head>
    <body>

        <article>
            <img id="display" src="">
        </article>
        <footer>
            <div id="count"></div>
            <div id="name"></div>
        </footer>
        <script>
            function setImg(index) {
                const display = document.querySelector("#display");
                display.src = images[index];
                
                const count = document.querySelector("#count");
                count.textContent = (index+1) + "/" + images.length

                const name = document.querySelector("#name");
                name.textContent = images[index];

                window.location.replace("#" + images[index])

            }
            function preload() {
                for (const image of images) {
                    const img = new Image();
                    img.src = image;
                }
            }
            function getInitialHashIndex() {
                for (let i = 0; i < images.length; i++) {
                    if ("#" + images[i] == window.location.hash) {
                        return i;
                    }
                }
                return 0;
            }
            let x0 = null;
            let offset = 0;
            function normalize(e) { return e.changedTouches ? e.changedTouches[0] : e };
            function lock(e) { x0 = normalize(e).clientX };
            function move(e) {
                if (x0 || x0 === 0) {
                    let dx = normalize(e).clientX - x0
                    let s = Math.sign(dx)
                    x0 = null
                    if (s < 0) {
                        next();
                    } else {
                        previous();
                    }
                }
            }
            function next() {
                let was = offset;
                offset += 1;
                if (offset >= images.length){
                    offset = 0
                }
                if (offset != was) {
                    setImg(offset)
                }
            }
            function previous() {
                let was = offset;
                offset -= 1;
                if (offset < 0) {
                    offset = images.length - 1
                }
                if (offset != was) {
                    setImg(offset)
                }                
            }
            const ar = document.querySelector("article")
            ar.addEventListener("touchmove", (e)=> {e.preventDefault()}, false)
            ar.addEventListener("mousedown", lock, false)
            ar.addEventListener("touchstart", lock, false)
            ar.addEventListener("mouseup", move, false)
            ar.addEventListener("touchend", move, false)
            document.addEventListener("keydown", (e) => {
                switch (e.keyCode) {
                    case 37:
                        if (e.altKey) {
                            return;
                        }
                        e.preventDefault();
                        previous();
                        break;
                    case 39:
                        if (e.altKey) {
                            return;
                        }
                        e.preventDefault();
                        next();
                        break;
                }
            }, false);
            const images = [
                /*{{ range $i, $file := . -}}  {{$i}}*/
                "{{ $file }}",
                /*{{ end }}End*/
            ]
            preload();
            const idx = getInitialHashIndex();
            setImg(idx);
        </script>
    </body>
</html>
